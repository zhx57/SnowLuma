[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- virtual display ------------------------------------------------------
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen %(ENV_SNOWLUMA_SCREEN)s -nolisten tcp -ac
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1",HOME="/app"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- remote desktop -------------------------------------------------------
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -rfbauth /run/x11vnc.pass
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6081 localhost:5900
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- QQ client ------------------------------------------------------------
[program:qq]
command=/usr/local/bin/snowluma-qq-launch
user=snowluma
environment=DISPLAY=":1",HOME="/app",XDG_RUNTIME_DIR="/app/.local/share/runtime"
directory=/app
autostart=true
autorestart=true
priority=50
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- SnowLuma -------------------------------------------------------------
; Started after QQ so the initial process scan finds it immediately. The hook
; still tolerates a late QQ start because HookManager keeps polling.
;
; cwd MUST be /app/data: the app resolves `data/`, `config/` and `logs/`
; relative to the working directory, and /app/data is the persisted volume.
[program:snowluma]
command=/usr/local/bin/node /app/index.mjs
user=snowluma
environment=DISPLAY=":1",HOME="/app",XDG_RUNTIME_DIR="/app/.local/share/runtime"
directory=/app/data
autostart=true
autorestart=true
priority=60
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
