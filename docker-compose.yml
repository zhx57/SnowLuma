services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-ghcr.io/zhx57/snowluma:latest}
    container_name: ${SNOWLUMA_CONTAINER:-snowluma}
    restart: unless-stopped

    # QQ is Chromium-based; the default 64MB /dev/shm crashes it.
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576

    # The hook addon injects into QQ via ptrace. Both are mandatory.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Leave empty to auto-generate on first start; the password is printed
      # once to the container log and stored in the data volume.
      VNC_PASSWD: ${VNC_PASSWD:-}
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      SNOWLUMA_WEBUI_HOST: ${SNOWLUMA_WEBUI_HOST:-0.0.0.0}
      SNOWLUMA_WEBUI_PORT: ${SNOWLUMA_WEBUI_PORT:-5099}
      SNOWLUMA_LOG_LEVEL: ${SNOWLUMA_LOG_LEVEL:-info}
      SNOWLUMA_SCREEN: ${SNOWLUMA_SCREEN:-1920x1080x24}
      SNOWLUMA_HOOK_AUTOLOAD: ${SNOWLUMA_HOOK_AUTOLOAD:-1}
      SNOWLUMA_EXTRA_QQ_HOMES: ${SNOWLUMA_EXTRA_QQ_HOMES:-}
      SNOWLUMA_QQ_FLAGS: ${SNOWLUMA_QQ_FLAGS:---disable-gpu --disable-software-rasterizer --disable-gpu-compositing}

    ports:
      - "${NOVNC_PORT:-6081}:6081"                                  # browser desktop (QR login)
      - "${SNOWLUMA_WEBUI_HOST_PORT:-5099}:${SNOWLUMA_WEBUI_PORT:-5099}"  # WebUI
      - "${ONEBOT_HTTP_PORT:-3000}:3000"                            # OneBot HTTP
      - "${ONEBOT_WS_PORT:-3001}:3001"                              # OneBot WebSocket

    volumes:
      - qq-gateway-data:/app/data          # SnowLuma config, OneBot config, caches
      - qq-client-config:/app/.config      # QQ client config
      - qq-client-data:/app/.local/share   # QQ login state and message cache

volumes:
  qq-gateway-data:
  qq-client-config:
  qq-client-data:
